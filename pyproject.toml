[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flightops-ml"
version = "0.1.0"
description = "An end-to-end flight departure delay risk prediction and monitoring platform."
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "pydantic>=2.0,<3",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.28,<1",
    "lightgbm>=4.3,<5",
    "catboost>=1.2,<2",
    "scikit-learn>=1.4,<2",
    "shap>=0.45,<1",
    "mlflow>=2.16,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.17,<0.18",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # Long embedded SQL queries, terminal logs, and plot styling

[tool.ruff.format]
quote-style = "double"